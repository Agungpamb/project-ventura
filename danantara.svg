<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="840" height="220">
  <defs>
    <style>
      .title { font-family: 'Liberation Sans', 'DejaVu Sans', 'Arial', sans-serif; font-size: 32px; font-weight: 900; fill: #0f172a; letter-spacing: 2px; }
      .subtitle { font-family: 'Liberation Sans', 'DejaVu Sans', 'Arial', sans-serif; font-size: 19px; font-weight: 700; fill: #64748b; letter-spacing: 3.5px; }
    </style>
  </defs>
  <!-- Red & Gold Danantara Geometric Icon -->
  <g transform="translate(15, 12)">
    <!-- Crimson tall pillar with angled top -->
    <polygon points="0,25 24,0 24,80 0,80" fill="#b91c1c" />
    <!-- Gold central pillar -->
    <polygon points="28,20 46,2 46,80 28,80" fill="#d97706" />
    <!-- Dark slate right pillar -->
    <polygon points="50,30 64,16 64,80 50,80" fill="#1e293b" />
  </g>
  <!-- Typography -->
  <text x="100" y="52" class="title">DANANTARA</text>
  <text x="100" y="82" class="subtitle">REPUBLIK INDONESIA</text>
</svg>